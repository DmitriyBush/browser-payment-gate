[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-payment-gate"
version = "0.1.0.dev0"
description = "Before an AI agent clicks, types or navigates in a web page, check whether the action could spend money; if it could, refuse and hand the step to a human."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = []
keywords = ["ai-agent", "browser", "playwright", "payment", "guardrail", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
test = ["pytest>=7", "playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browser_payment_gate = ["scan.js", "lists.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
